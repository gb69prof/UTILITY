<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08283d">
  <meta name="description" content="Presentazione interattiva per imparare a distinguere testo, antefatto e contesto.">
  <title>Capire un testo · Testo, antefatto, contesto</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <noscript>Questa presentazione richiede JavaScript per funzionare.</noscript>

  <div class="presentation-shell">
    <header class="topbar">
      <button class="brand" type="button" data-target="0" aria-label="Torna alla copertina">TAC <span>Capire un testo</span></button>
      <div class="top-actions">
        <button class="icon-button" id="indexBtn" type="button" aria-expanded="false" aria-controls="indexPanel">Indice</button>
        <a class="utility-link" href="../../index.html">UTILITY</a>
        <button class="icon-button" id="fullscreenBtn" type="button" aria-label="Attiva schermo intero">Schermo intero</button>
      </div>
    </header>

    <main class="stage" aria-live="polite">
      <section class="slide-card" id="slide" tabindex="-1"></section>

    </main>

    <dialog id="indexPanel" aria-labelledby="indexTitle">
      <div class="index-title"><h2 id="indexTitle">Indice</h2><button id="closeIndexBtn" type="button" aria-label="Chiudi indice">Chiudi</button></div>
      <nav id="indexNav" aria-label="Indice della lezione"></nav>
    </dialog>
    <footer class="controls">
      <button class="nav-button" id="prevBtn" type="button">Precedente</button>
      <nav class="concept-links" aria-label="Concetti della lezione">
        <button type="button" data-target="4" style="--accent:#176ead">Contesto</button>
        <button type="button" data-target="3" style="--accent:#587d32">Antefatto</button>
        <button type="button" data-target="2" style="--accent:#b83d31">Testo</button>
      </nav>
      <div class="progress">
        <span id="counter">1 / 10</span>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
      <button class="nav-button primary" id="nextBtn" type="button">Successiva</button>
    </footer>
  </div>

  <script src="./js/app.js" defer></script>
</body>
</html>
